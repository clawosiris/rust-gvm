[package]
name = "gvm-mock-server"
description = "Programmable mock GMP server for testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "gvm-mock-server"
path = "src/main.rs"

[features]
default = []
unix-socket-tests = []
tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:x509-cert",
    "dep:p256",
    "dep:sha2",
]
ssh = ["dep:russh"]

[dependencies]
base64.workspace = true
gvm-gmp.workspace = true
gvm-protocol.workspace = true
tokio.workspace = true
quick-xml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tempfile.workspace = true
clap.workspace = true
chrono.workspace = true

# Feature-gated
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
getrandom.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true
tokio-test.workspace = true

# `sha2` is a feature-only dependency: its `oid` feature lets the X.509
# builder encode the P-256 signature algorithm identifier.
[package.metadata.cargo-machete]
ignored = ["sha2"]

[lints]
workspace = true
