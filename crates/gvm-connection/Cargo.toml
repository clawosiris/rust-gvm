[package]
name = "gvm-connection"
description = "Transport layer for GVM connections (Unix socket, TLS, SSH)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["unix"]
unix = []
unix-socket-tests = []
large-response-tests = ["unix-socket-tests"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]
ssh = ["dep:russh", "gvm-mock-server/ssh"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
gvm-protocol.workspace = true

# Feature-gated
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
russh = { workspace = true, optional = true }

[package.metadata.cargo-machete]
ignored = ["rustls", "rustls-pemfile", "tokio-rustls"]  # TLS feature-gated, not yet implemented

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio-test.workspace = true
gvm-gmp.workspace = true
gvm-mock-server.workspace = true

[lints]
workspace = true
