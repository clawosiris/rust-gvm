# Orchestrated Release — dispatch with an explicit version.
#
# This workflow:
# 1. Validates the version already merged through the protected branch
# 2. Creates the release via pontos (changelog, tag, GitHub release)
# 3. Waits for release.yml (triggered by tag push) to build and upload artifacts
#
# The orchestrator waits for this workflow to complete before proceeding to
# downstream repos (rust-gvm-api, gvm-rools, etc.).

name: Orchestrated Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without 'v' prefix)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: "Release v${{ inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Set up Python and pontos
        uses: greenbone/actions/setup-pontos@1e7f352e793c3815c54aebe8f9da50d7a80e6f41 # v3.36.18

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify workspace release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION="$(awk '
            $0 == "[workspace.package]" { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Expected workspace version $RELEASE_VERSION, found $CURRENT_VERSION" >&2
            exit 1
          fi

      - name: Create release with pontos
        env:
          GITHUB_USER: ${{ vars.RELEASE_USER || github.actor }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          ARGS="--release-version ${{ inputs.version }}"
          ARGS="$ARGS --versioning-scheme semver"
          ARGS="$ARGS --project-types cargo"
          ARGS="$ARGS --git-tag-prefix v"
          ARGS="$ARGS --no-next-version"
          ARGS="$ARGS --no-update-project"

          if [[ "${{ inputs.version }}" == *"-"* ]]; then
            ARGS="$ARGS --github-pre-release"
          fi

          pontos-release create $ARGS --repository ${{ github.repository }}

      - name: Wait for release.yml triggered by tag push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --event push \
              --branch "v${RELEASE_VERSION}" \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.RELEASE_SHA) | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "release.yml did not start for v${RELEASE_VERSION} at ${RELEASE_SHA}" >&2
            exit 1
          fi

          gh run watch "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --interval 30 \
            --exit-status
