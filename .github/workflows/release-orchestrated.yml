# Orchestrated Release — triggered by clawosiris/release-orchestrator
# Do NOT trigger manually — use the orchestrator instead.
#
# This workflow:
# 1. Creates the release via pontos (changelog, tag, GitHub release)
# 2. Waits for release.yml (triggered by tag push) to build and upload artifacts
#
# The orchestrator waits for this workflow to complete before proceeding to
# downstream repos (rust-gvm-api, gvm-rools, etc.).

name: Orchestrated Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without 'v' prefix)"
        required: true
        type: string
      release-type:
        description: "Release type (alpha, beta, release-candidate, patch, minor, major)"
        required: false
        type: string
        default: "patch"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: "Release v${{ inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Set up Python and pontos
        uses: greenbone/actions/setup-pontos@v3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release with pontos
        env:
          GITHUB_USER: ${{ vars.RELEASE_USER || 'clawosiris' }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          ARGS="--release-version ${{ inputs.version }}"
          ARGS="$ARGS --versioning-scheme semver"
          ARGS="$ARGS --project-types cargo"
          ARGS="$ARGS --git-tag-prefix v"
          ARGS="$ARGS --no-next-version"

          if [[ "${{ inputs.version }}" == *"-"* ]]; then
            ARGS="$ARGS --github-pre-release"
          fi

          pontos-release create $ARGS --repository ${{ github.repository }}

      - name: Regenerate Cargo.lock
        run: |
          cargo generate-lockfile
          if ! git diff --quiet Cargo.lock 2>/dev/null; then
            git add Cargo.lock
            git commit --amend --no-edit
            git push --force-with-lease
            TAG="v${{ inputs.version }}"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi

      - name: Trigger release.yml and wait for completion
        uses: greenbone/actions/trigger-workflow@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: ${{ github.repository }}
          workflow: release.yml
          ref: v${{ inputs.version }}
          wait-for-completion-timeout: "1800"
          wait-for-completion-interval: "30"
