name: Security

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'journal/**'
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'journal/**'
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Rust advisory database check
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@0abfcd587b70a713fdaa7fb502c885e2112acb15 # v2
        with:
          tool: cargo-audit@0.22.1
      - name: Run cargo-audit
        run: cargo audit

  # Check for unused dependencies
  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@0abfcd587b70a713fdaa7fb502c885e2112acb15 # v2
        with:
          tool: cargo-machete@0.9.1
      - name: Run cargo-machete
        run: cargo machete

  # Track dependency audit coverage and block unvetted updates
  cargo-vet:
    name: Cargo Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@a164de717a0ee9284c2d9db1c6016a4c339cd333 # cargo-vet
        with:
          tool: cargo-vet
      - name: Run cargo-vet
        run: cargo vet

  # Non-blocking dependency unsafe usage report
  cargo-geiger-report:
    name: Cargo Geiger Report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@a164de717a0ee9284c2d9db1c6016a4c339cd333 # cargo-geiger
        with:
          tool: cargo-geiger
      - name: Generate geiger reports (all workspace crates)
        shell: bash
        run: |
          mkdir -p target/geiger
          crates=(gvm-protocol gvm-gmp gvm-client gvm-connection gvm-mock-server)
          for crate in "${crates[@]}"; do
            cargo geiger \
              --manifest-path "$PWD/crates/$crate/Cargo.toml" \
              --all-features \
              --all-dependencies \
              --output-format Ascii > "target/geiger/${crate}.txt" || true
          done
      - name: Upload geiger artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cargo-geiger-report
          path: target/geiger

  # Blocking check: our crates must not use unsafe
  cargo-geiger-workspace-gate:
    name: Cargo Geiger Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@a164de717a0ee9284c2d9db1c6016a4c339cd333 # cargo-geiger
        with:
          tool: cargo-geiger
      - name: Fail if workspace crates use unsafe
        run: python3 scripts/check_workspace_unsafe.py

  # OSSF Scorecard (supply chain security)
  # Requires public repo — enable when repo visibility changes
  # scorecard:
  #   name: OpenSSF Scorecard
  #   runs-on: ubuntu-latest
  #   if: github.event_name != 'pull_request'
  #   permissions:
  #     security-events: write
  #     id-token: write
  #   steps:
  #     - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
  #       with:
  #         egress-policy: audit
  #     - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  #       with:
  #         persist-credentials: false
  #     - name: Run Scorecard
  #       uses: ossf/scorecard-action@v2.4.3
  #       with:
  #         results_file: results.sarif
  #         results_format: sarif
  #         publish_results: true
  #     - name: Upload SARIF
  #       uses: github/codeql-action/upload-sarif@v4
  #       if: always()
  #       with:
  #         sarif_file: results.sarif

  # Semgrep SAST (static application security testing)
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: >-
            p/rust
            p/security-audit
            p/secrets
          generateSarif: "1"
      - name: Upload SARIF
        # Code scanning must be enabled for the repo for SARIF upload to work.
        # For private repos, this requires GitHub Advanced Security (GHAS).
        # Making this non-blocking until code scanning is enabled.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v3
        with:
          sarif_file: semgrep.sarif
