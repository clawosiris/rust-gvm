name: Security

on:
  push:
    branches: [main, devel]
    paths-ignore:
      - 'journal/**'
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    # Keep the workflow running for docs-only PRs so branch protection always
    # receives the required `Security` status check.
    branches: [main, devel]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  SBOMQS_VERSION: "v2.0.5"
  SBOM_QUALITY_THRESHOLD: "8.3"

jobs:
  # Rust advisory database check
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-audit@0.22.1
      - name: Run cargo-audit
        run: cargo audit

  # Check for unused dependencies
  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-machete@0.9.1
      - name: Run cargo-machete
        run: cargo machete

  # Track dependency audit coverage and block unvetted updates
  cargo-vet:
    name: Cargo Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # cargo-vet
        with:
          tool: cargo-vet
      - name: Run cargo-vet
        run: cargo vet

  # Generate, enrich, and enforce the release SBOM quality policy before tags.
  sbom-quality:
    name: SBOM Quality
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: cargo-cyclonedx@${{ env.CARGO_CYCLONEDX_VERSION }}

      - name: Test SBOM policy helpers
        run: python3 -B -m unittest tests.test_sbom_postprocess tests.test_sbom_quality -q

      - name: Generate CycloneDX SBOMs
        run: >-
          cargo cyclonedx --format json --all --all-features --target all
          --spec-version 1.5

      - name: Collect and post-process SBOMs
        shell: bash
        run: |
          mkdir -p sbom-artifacts
          find crates -name '*.cdx.json' -exec cp {} sbom-artifacts/ \;
          python3 scripts/sbom_postprocess.py \
            --cargo-toml Cargo.toml \
            --declare-dependency-complete \
            sbom-artifacts/*.cdx.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Install sbomqs
        run: |
          go install github.com/interlynk-io/sbomqs/v2@${{ env.SBOMQS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enforce SBOM quality
        shell: bash
        run: |
          sbomqs score --json sbom-artifacts/*.cdx.json > sbomqs-results.json
          python3 scripts/check_sbom_quality.py \
            --threshold "$SBOM_QUALITY_THRESHOLD" \
            sbomqs-results.json

  # Non-blocking dependency unsafe usage report
  cargo-geiger-report:
    name: Cargo Geiger Report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # cargo-geiger
        with:
          tool: cargo-geiger
      - name: Generate geiger reports (all workspace crates)
        shell: bash
        run: |
          mkdir -p target/geiger
          crates=(gvm-protocol gvm-gmp gvm-client gvm-connection gvm-mock-server)
          for crate in "${crates[@]}"; do
            cargo geiger \
              --manifest-path "$PWD/crates/$crate/Cargo.toml" \
              --all-features \
              --all-dependencies \
              --output-format Ascii > "target/geiger/${crate}.txt" || true
          done
      - name: Upload geiger artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cargo-geiger-report
          path: target/geiger

  # Blocking check: our crates must not use unsafe
  cargo-geiger-workspace-gate:
    name: Cargo Geiger Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # cargo-geiger
        with:
          tool: cargo-geiger
      - name: Fail if workspace crates use unsafe
        run: python3 scripts/check_workspace_unsafe.py

  # OSSF Scorecard (supply chain security)
  # Requires public repo — enable when repo visibility changes
  # scorecard:
  #   name: OpenSSF Scorecard
  #   runs-on: ubuntu-latest
  #   if: github.event_name != 'pull_request'
  #   permissions:
  #     security-events: write
  #     id-token: write
  #   steps:
  #     - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
  #       with:
  #         egress-policy: audit
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - name: Run Scorecard
  #       uses: ossf/scorecard-action@v2.4.3
  #       with:
  #         results_file: results.sarif
  #         results_format: sarif
  #         publish_results: true
  #     - name: Upload SARIF
  #       uses: github/codeql-action/upload-sarif@v4
  #       if: always()
  #       with:
  #         sarif_file: results.sarif

  # Semgrep SAST (static application security testing)
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: >-
            p/rust
            p/security-audit
            p/secrets
          generateSarif: "1"
      - name: Upload SARIF
        # Code scanning must be enabled for the repo for SARIF upload to work.
        # For private repos, this requires GitHub Advanced Security (GHAS).
        # Making this non-blocking until code scanning is enabled.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif

  security:
    name: Security
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - cargo-audit
      - cargo-machete
      - cargo-vet
      - sbom-quality
      - cargo-geiger-report
      - cargo-geiger-workspace-gate
      - semgrep
    steps:
      - name: Require all security jobs to pass
        env:
          CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          CARGO_MACHETE_RESULT: ${{ needs.cargo-machete.result }}
          CARGO_VET_RESULT: ${{ needs.cargo-vet.result }}
          SBOM_QUALITY_RESULT: ${{ needs.sbom-quality.result }}
          CARGO_GEIGER_REPORT_RESULT: ${{ needs.cargo-geiger-report.result }}
          CARGO_GEIGER_WORKSPACE_GATE_RESULT: ${{ needs.cargo-geiger-workspace-gate.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          test "$CARGO_AUDIT_RESULT" = success
          test "$CARGO_MACHETE_RESULT" = success
          test "$CARGO_VET_RESULT" = success
          test "$SBOM_QUALITY_RESULT" = success
          test "$CARGO_GEIGER_REPORT_RESULT" = success
          test "$CARGO_GEIGER_WORKSPACE_GATE_RESULT" = success
          test "$SEMGREP_RESULT" = success
