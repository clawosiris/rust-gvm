name: Nightly

on:
  schedule:
    # Run at 04:00 UTC every day
    - cron: "0 4 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: gvm-mock-server

jobs:
  # Full test suite including integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install python-gvm

      # Workspace tests
      - run: cargo test --workspace --all-features

      # Python integration test
      - run: cargo build -p gvm-mock-server
      - run: python3 tests/integration/test_python_gvm.py

      # Clippy (treat warnings as errors for nightly)
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Build nightly binaries for all platforms
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gvm-mock-server-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gvm-mock-server-linux-arm64
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: gvm-mock-server-linux-amd64-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: gvm-mock-server-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: gvm-mock-server-macos-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p gvm-mock-server

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p gvm-mock-server

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz ${{ env.BINARY_NAME }}
          cd ../../..
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          retention-days: 7

  # Generate SBOM (Software Bill of Materials) in CycloneDX format
  sbom:
    name: Generate SBOM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-sbom

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate CycloneDX SBOM (JSON)
        run: cargo cyclonedx --format json --all --spec-version 1.5

      - name: Generate CycloneDX SBOM (XML)
        run: cargo cyclonedx --format xml --all --spec-version 1.5

      - name: Collect SBOMs
        shell: bash
        run: |
          mkdir -p sbom-artifacts
          find . -name '*.cdx.json' -not -path '*/target/*' -exec cp {} sbom-artifacts/ \;
          find . -name '*.cdx.xml' -not -path '*/target/*' -exec cp {} sbom-artifacts/ \;
          ls -la sbom-artifacts/

      - name: Post-process CycloneDX JSON SBOMs
        shell: bash
        run: |
          python3 scripts/sbom_postprocess.py --cargo-toml Cargo.toml sbom-artifacts/*.cdx.json

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install sbomqs
        run: |
          go install github.com/interlynk-io/sbomqs@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Score post-processed SBOMs
        shell: bash
        run: |
          sbomqs score --json sbom-artifacts/*.cdx.json > sbomqs-results.json
          python3 - sbomqs-results.json <<'PY'
          import json
          import sys

          threshold = 7.0
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle)

          failures = []
          for entry in data.get("files", []):
              score = float(entry.get("avg_score", 0.0))
              path = entry.get("path") or entry.get("file") or entry.get("fileName") or "<unknown>"
              print(f"{path}: {score:.2f}/10")
              if score < threshold:
                  failures.append((path, score))

          if failures:
              for path, score in failures:
                  print(f"::error file={path}::SBOM quality score below {threshold:.1f}: {score:.2f}")
              raise SystemExit(1)
          PY

      - name: Package SBOMs
        run: |
          cd sbom-artifacts
          tar czf ../rust-gvm-sbom.tar.gz *.cdx.*
          cd ..
          sha256sum rust-gvm-sbom.tar.gz > rust-gvm-sbom.tar.gz.sha256

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            rust-gvm-sbom.tar.gz
            rust-gvm-sbom.tar.gz.sha256
            sbomqs-results.json
          retention-days: 7

  # Update the rolling "nightly" pre-release
  publish:
    name: Publish Nightly
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Set date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (${{ steps.date.outputs.today }})"
          prerelease: true
          body: |
            Automated nightly build from `main` branch.

            **⚠️ This is a development build — not recommended for production.**

            Built from commit: ${{ github.sha }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
